name: action-self-smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  self-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create synthetic service manifest
        run: |
          mkdir -p .tmp/action-smoke/services/billing
          cat > .tmp/action-smoke/services/billing/service.yaml <<'YAML'
          schemaVersion: scg.service/v1alpha1
          id: billing-api
          name: Billing API
          lifecycle: production
          owner:
            type: team
            ref: team:platform
          repository:
            provider: github
            slug: example/billing-api
          runtime:
            language: typescript
            platform: node
          deploy:
            type: container
            targets:
              - environment: production
                provider: unknown
                ref: billing-api-prod
          data:
            storesPersonalData: false
            classification: internal
          dependencies: []
          metadata:
            lastReviewedAt: "2026-07-01"
          YAML

      - id: scg
        uses: ./
        with:
          roots: .tmp/action-smoke/services
          report: "true"
          format: json,dot,html
          output-directory: .tmp/action-smoke/.catalog

      - name: Assert action outputs and reports
        run: |
          test "${{ steps.scg.outputs.service-count }}" = "1"
          test "${{ steps.scg.outputs.error-count }}" = "0"
          test "${{ steps.scg.outputs.warning-count }}" = "0"
          test "${{ steps.scg.outputs.report-directory }}" = ".tmp/action-smoke/.catalog"
          test -f .tmp/action-smoke/.catalog/catalog.json
          test -f .tmp/action-smoke/.catalog/graph.dot
          test -f .tmp/action-smoke/.catalog/report.html

      - name: Create synthetic ZDP service manifests
        run: |
          mkdir -p .tmp/action-smoke/zdp-valid/client-surfaces/zdp-web-apps
          cat > .tmp/action-smoke/zdp-valid/client-surfaces/zdp-web-apps/service.yaml <<'YAML'
          contract:
            schema_version: 2
            contract_version: 1
            last_reviewed_at: 2026-07-07
          service:
            id: app-console
            owner: 0disoft
            repo: zdp-web-apps
            status: experiment
            tier: tier2
            risk_level: medium
          lifecycle:
            stage: foundation
          domain:
            type: admin
            user_facing: true
            public_api: false
            money_movement: false
          runtime:
            core: sveltekit
            framework: sveltekit-contracts
          cost:
            cost_center: web-apps
            owner: 0disoft
          data:
            pii_level: none
            payment_data: false
            message_content: false
            ai_user_data: false
            money_movement: false
          dependencies:
            services:
              - core-api
            datastores: []
            queues: []
            workers: []
            internal_apis: []
          YAML
          mkdir -p .tmp/action-smoke/zdp-warning/client-surfaces/zdp-web-apps
          cp .tmp/action-smoke/zdp-valid/client-surfaces/zdp-web-apps/service.yaml .tmp/action-smoke/zdp-warning/client-surfaces/zdp-web-apps/service.yaml
          sed -i 's/2026-07-07/2099-12-31/' .tmp/action-smoke/zdp-warning/client-surfaces/zdp-web-apps/service.yaml

      - id: scg_zdp
        uses: ./
        with:
          roots: .tmp/action-smoke/zdp-valid/client-surfaces/zdp-web-apps
          input-schema: zdp-v2
          allow-unknown-dependencies: "true"
          fail-on-warning: "true"

      - name: Assert ZDP action outputs
        run: |
          test "${{ steps.scg_zdp.outputs.service-count }}" = "1"
          test "${{ steps.scg_zdp.outputs.error-count }}" = "0"
          test "${{ steps.scg_zdp.outputs.warning-count }}" = "0"

      - id: scg_zdp_warning
        continue-on-error: true
        uses: ./
        with:
          roots: .tmp/action-smoke/zdp-warning/client-surfaces/zdp-web-apps
          input-schema: zdp-v2
          allow-unknown-dependencies: "true"
          fail-on-warning: "true"

      - name: Assert ZDP warning failure
        if: always()
        run: |
          test "${{ steps.scg_zdp_warning.outcome }}" = "failure"
