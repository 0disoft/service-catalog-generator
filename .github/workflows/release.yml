name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-check.mjs
      - run: pnpm run check
      - run: node scripts/pack-smoke.mjs

      - name: Capture release recovery state
        id: release-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_TAG="v${VERSION%%.*}"
          PREVIOUS_MAJOR_TARGET="$(git rev-parse -q --verify "refs/tags/$MAJOR_TAG" || true)"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::GitHub Release $GITHUB_REF_NAME already exists."
            exit 1
          fi

          {
            echo "major-tag=$MAJOR_TAG"
            echo "previous-major-target=$PREVIOUS_MAJOR_TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Move major Action tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAJOR_TAG="${{ steps.release-preflight.outputs.major-tag }}"
          LOOKUP_ENDPOINT="repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR_TAG}"
          REF_ENDPOINT="repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}"

          if gh api "$LOOKUP_ENDPOINT" >/dev/null 2>&1; then
            gh api --silent --method PATCH "$REF_ENDPOINT" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR_TAG}" \
              -f sha="$GITHUB_SHA"
          fi

      - name: Publish npm package
        run: npm publish --access public

      - name: Recover GitHub release state when npm publish fails
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.release-preflight.outputs.major-tag }}
          PREVIOUS_MAJOR_TARGET: ${{ steps.release-preflight.outputs.previous-major-target }}
        run: |
          set -euo pipefail
          echo "::warning::Release workflow failed before npm publish completed. Restoring GitHub release state where possible."
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true

          if [ -z "$MAJOR_TAG" ]; then
            echo "::warning::Major Action tag was not computed; skipping Action tag recovery."
            exit 0
          fi

          REF_ENDPOINT="repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}"

          if [ -n "$PREVIOUS_MAJOR_TARGET" ]; then
            gh api --silent --method PATCH "$REF_ENDPOINT" \
              -f sha="$PREVIOUS_MAJOR_TARGET" \
              -F force=true
          else
            gh api --silent --method DELETE "$REF_ENDPOINT" || true
          fi
