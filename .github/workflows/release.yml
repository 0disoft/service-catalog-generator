name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-check.mjs
      - run: pnpm run check
      - name: Verify committed Action bundle
        run: git diff --exit-code -- dist/action/index.cjs
      - run: node scripts/pack-smoke.mjs

      - name: Capture release recovery state
        id: release-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_TAG="v${VERSION%%.*}"
          PREVIOUS_MAJOR_TARGET="$(git rev-parse -q --verify "refs/tags/$MAJOR_TAG" || true)"
          if [[ "$VERSION" == *-* ]]; then
            NPM_DIST_TAG="next"
            RELEASE_KIND="prerelease"
            PROMOTE_MAJOR_TAG="false"
          else
            NPM_DIST_TAG="latest"
            RELEASE_KIND="stable"
            PROMOTE_MAJOR_TAG="true"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::GitHub Release $GITHUB_REF_NAME already exists."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "major-tag=$MAJOR_TAG"
            echo "previous-major-target=$PREVIOUS_MAJOR_TARGET"
            echo "npm-dist-tag=$NPM_DIST_TAG"
            echo "release-kind=$RELEASE_KIND"
            echo "promote-major-tag=$PROMOTE_MAJOR_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify npm version is unpublished
        env:
          NPM_PACKAGE_NAME: "@0disoft/service-catalog-generator"
          NPM_PACKAGE_VERSION: ${{ steps.release-preflight.outputs.version }}
        run: node scripts/npm-release-visibility.mjs expect-absent

      - name: Create GitHub release
        id: release-create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_FLAGS=()
          if [ "${{ steps.release-preflight.outputs.release-kind }}" = "prerelease" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Move major Action tag
        if: ${{ steps.release-preflight.outputs.promote-major-tag == 'true' }}
        id: major-tag
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.release-preflight.outputs.major-tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/github-major-tag.mjs promote
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish npm package
        env:
          NPM_DIST_TAG: ${{ steps.release-preflight.outputs.npm-dist-tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Recover GitHub release state when npm publish fails
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAJOR_TAG: ${{ steps.release-preflight.outputs.major-tag }}
          PREVIOUS_MAJOR_TARGET: ${{ steps.release-preflight.outputs.previous-major-target }}
          RELEASE_CREATED: ${{ steps.release-create.outputs.created }}
          MAJOR_TAG_CHANGED: ${{ steps.major-tag.outputs.changed || 'false' }}
          NPM_PACKAGE_NAME: "@0disoft/service-catalog-generator"
          NPM_PACKAGE_VERSION: ${{ steps.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          echo "::warning::Release workflow failed before npm publish completed. Restoring GitHub release state where possible."

          if [ "$RELEASE_CREATED" != "true" ] && [ "$MAJOR_TAG_CHANGED" != "true" ]; then
            echo "::warning::This run created no release state; no recovery is required."
            exit 0
          fi

          NPM_RELEASE_STATE="$(node scripts/npm-release-visibility.mjs state)"
          if [ "$NPM_RELEASE_STATE" != "absent" ]; then
            echo "::warning::npm release state is $NPM_RELEASE_STATE; preserving GitHub release and tag state for forward-fix review."
            exit 0
          fi

          if [ "$RELEASE_CREATED" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          else
            echo "::warning::This run did not create the GitHub Release; leaving existing release state untouched."
          fi

          if [ "$MAJOR_TAG_CHANGED" != "true" ]; then
            echo "::warning::This run did not move the major Action tag; leaving tag state untouched."
            exit 0
          fi

          node scripts/github-major-tag.mjs restore
