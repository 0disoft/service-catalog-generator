schemaVersion: scg.service/v1
id: storefront-api
name: Storefront API
lifecycle: production
owner:
  type: team
  ref: team:commerce
repository:
  provider: github
  slug: example/commerce-monorepo
runtime:
  language: typescript
  platform: node
deploy:
  type: container
  targets:
    - environment: production
      provider: unknown
      ref: storefront-api-prod
data:
  storesPersonalData: false
  classification: internal
dependencies:
  - type: service
    target: identity-api
    direction: outbound
    criticality: required
    reason: authenticates storefront sessions
metadata:
  lastReviewedAt: "2026-07-21"
